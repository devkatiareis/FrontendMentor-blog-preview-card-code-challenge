<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katia Reis | Blog Preview Card</title>

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./assets/images/favicon-kreis-32x32.png"
  />
  <link rel="stylesheet" href="./assets/styles/style.css" />
</head>
<body>

  <main
    class="main-container"
    aria-label="Blog preview card challenge by Frontend Mentor"
  >
    <section aria-labelledby="blog-heading">
      <!-- Card Structure -->
      <article class="card" tabindex="0">
        <!-- Card Image -->
        <div class="card-image-container">
          <img
            class="card-image"
            src="./assets/images/illustration-article.svg"
            alt="Ilustração abstrata"
          />
        </div>

        <!-- Post Tags -->
        <span class="badge">Learning</span>

        

        <p class="publish-date post-meta">
          <time datetime="2026-05-31">31 de Maio de 2026</time>
        </p>

        <h3 class="card-title">HTML & CSS foundations</h3>

        <p class="post-excerpt">
          These languages are the backbones of every website, defining
          structure, content, and presentation.
        </p>

        <!-- Author Information -->
        <div class="author-container">
          <img
            class="author-avatar"
            src="./assets/images/avatar-kreis-65x65.png"
            alt="Katia Reis, designer and developer"
          />
          <span class="author-name">Katia Reis</span>
        </div>
      </article>
    </section>
  </main>

  <!-- Footer -->
  <footer class="attribution post-meta">
    Challenge by
    <a
      href="https://www.frontendmentor.io?ref=challenge"
      target="_blank"
      rel="noopener noreferrer"
      >Frontend Mentor</a
    >. Coded by
    <a
      href="https://github.com/devkatiareis/FrontendMentor-blog-preview-card-code-challenge"
      target="_blank"
      rel="noopener noreferrer"
      >Katia Reis</a
    >.
  </footer>

</body>
</html>
